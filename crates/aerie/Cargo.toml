[package]
name = "aerie"
version = "0.4.4"
edition = "2024"
default-run = "aerie"

[[bin]]
name = "aerie"
required-features = ["desktop"]

[[bin]]
name = "backend"
required-features = ["backend"]

[[bin]]
name = "web-client"
required-features = ["web-ui"]

[[bin]]
name = "runner"
required-features = []

[[bin]]
name = "migrate-workflow"
required-features = ["migration"]

[dependencies]
anyhow = "1.0.100"
arc-swap = { version = "1.7.1", features = ["serde"] }
axum = { version = "0.8.8", optional = true }
axum-extra = { version = "0.12.6", features = [
  "typed-header",
], optional = true }
base64 = "0.22.1"
cached = { version = "4.0.0", default-features = false, features = [
  "proc_macro",
  "time_stores",
] }
clap = { version = "4.5.48", features = ["env", "derive"] }
decorum = "0.4.0"
delegate = "0.13.5"
dirs = "6.0.0"
eframe = { version = "0.33.2", optional = true }
egui = { version = "0.33.2", optional = true }
egui-phosphor = { version = "0.11.0", optional = true }
egui-snarl = { version = "0.9.0", features = [
  "serde",
], default-features = false }
egui_commonmark = { version = "0.22.0", optional = true }
egui_extras = { version = "0.33.2", features = [
  "http",
  "image",
  "syntect",
], optional = true }
egui_tiles = { version = "0.14.0", optional = true }
egui_graphs = { version = "0.29.0", optional = true }
env_logger = "0.11.8"
flume = { version = "0.12", features = ["async"] }
glob = "0.3.3"
im = { version = "15.1.0", features = ["serde", "debug"] }
image = { version = "0.25.8", features = ["jpeg", "png"] }
itertools = "0.14.0"
kinded = "0.5.0"
log = "0.4.28"
minijinja = { version = "2.11.0", features = ["loader", "json"] }
petgraph = { version = "0.8", default-features = false, features = [
  "stable_graph",
], optional = true }
regex = "1.12.2"
# rig-dynclient = { path = "/code/rust/rig-dynclient", features = [] }
rig-dynclient = { git = "https://github.com/patonw/rig-dynclient.git", tag = "v0.41.0" }
rpds = { version = "1.2.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_with = "3.15.0"
thiserror = "2.0.17"
tokio = { version = "1.51.1", features = ["macros"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3.20", features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
] }
typed-builder = "0.23.1"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
colorous = { version = "1.0.16", optional = true }
derive_builder = "0.20.2"
jaq-core = "2.2.1"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
jaq-std = "2.1.2"
jsonschema = { version = "0.44", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = [
  "xdg-portal",
], optional = true }
chrono = "0.4.42"
futures-util = "0.3.31"
either = { version = "1.15.0", features = ["serde"] }
dotenvy = { version = "0.15.7", features = ["clap"] }
humantime = "2.3.0"
enum-assoc = "1.3.0"
enum-iterator = "2.3.0"
typetag = "0.2.21"
downcast-rs = "2.0.2"
dyn-eq = "0.1.3"
saphyr = { version = "0.0.6", optional = true }
dyn-clone = "1.0.20"
dyn-hash = "1.0.0"
inventory = "0.3.21"
rhai = { version = "1.23.6", optional = true, features = [
  "serde",
  "serde_json",
] }
scopeguard = "1.2.0"
rayon = "1.11.0"
subst = { version = "0.3.8", features = ["preserve-order"] }
serde_yaml_ng = "0.10.0"
lru = "0.16.3"
reqwest = { version = "0.13.2", optional = true }
url = { version = "2.5.8", optional = true }
toml = { version = "1.1.2", features = ["preserve_order"] }
strum = { version = "0.28.0", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
sled = "0.34.7"
struson = { version = "0.7.2", features = ["serde"] }
rmcp = { version = "2.2.0", features = [] }
schemars = { version = "1.2.1", optional = true }
tokio-stream = "0.1.18"
async-stream = "0.3.6"
async-broadcast = "0.7.2"
ewebsock = { version = "0.8.0", optional = true }
rmp-serde = { version = "1.3.1", optional = true }
web-time = { version = "1.1.0", features = ["serde"] }
gloo-timers = { version = "0.4.0", optional = true }
sha3 = "0.12.0"
serde_path_to_error = "0.1.20"

[features]
native = [
  "wip",
  "cached/redb_store",
  "rig-dynclient/rmcp",
  "tokio/full",
  "jsonschema/default",
  "rmcp/macros",
  "rmcp/transport-io",
  "rmcp/transport-child-process",
  "rmcp/transport-streamable-http-server",
  "rmcp/client-side-sse",
]
debug-ui = []
default = ["fetch-image", "runner-http", "runner-mcp", "scripting"]
runner-http = ["native", "dep:axum"]
runner-mcp = ["native", "dep:axum", "dep:schemars"]
migration = ["dep:saphyr"]
scripting = ["dep:rhai"]
fetch-image = ["dep:reqwest", "dep:url"]
desktop = ["native", "ui", "dep:egui_graphs"]
web-ui = [
  "ui",
  "dep:ewebsock",
  # "cached/wasm",
  "uuid/js",
  "dep:rmp-serde",
  "dep:gloo-timers",
  "dep:rfd",
  "dep:url",
]
backend = [
  "native",
  "ui",
  "dep:egui_graphs",
  "axum/ws",
  "dep:axum-extra",
  "dep:rmp-serde",
] # TODO: remove dep:egui_graphs
ui = [
  "dep:colorous",
  "dep:eframe",
  "dep:egui",
  "dep:egui-phosphor",
  "dep:egui_commonmark",
  "dep:egui_extras",
  "dep:egui_tiles",
  "dep:petgraph",
  "dep:rfd",
  "egui-snarl/ui",
]
wip = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.103"
