[package]
name = "aerie"
version = "0.2.4"
edition = "2024"
default-run = "aerie"

[[bin]]
name = "aerie"
required-features = ["ui"]

[[bin]]
name = "runner"
required-features = []

[[bin]]
name = "migrate-workflow"
required-features = ["migration"]

[dependencies]
anyhow = "1.0.100"
arc-swap = { version = "1.7.1", features = ["serde"] }
base64 = "0.22.1"
cached = "0.59.0"
clap = { version = "4.5.48", features = ["env", "derive"] }
decorum = "0.4.0"
delegate = "0.13.5"
dirs = "6.0.0"
eframe = { version = "0.33.2", optional = true }
egui = { version = "0.33.2", optional = true }
egui-phosphor = { version = "0.11.0", optional = true }
egui-snarl = { git = "https://github.com/patonw/egui-snarl", branch = "ui-flag", default-features = false, features = [
  "serde",
] }
egui_commonmark = { version = "0.22.0", optional = true }
egui_extras = { version = "0.33.2", features = [
  "http",
  "image",
  "syntect",
], optional = true }
egui_tiles = { version = "0.14.0", optional = true }
egui_graphs = { version = "0.29.0", optional = true }
env_logger = "0.11.8"
flume = { version = "0.12", features = ["async"] }
glob = "0.3.3"
im = { version = "15.1.0", features = ["serde", "debug"] }
image = { version = "0.25.8", features = ["png"] }
itertools = "0.14.0"
kinded = "0.5.0"
log = "0.4.28"
minijinja = { version = "2.11.0", features = ["loader", "json"] }
petgraph = { version = "0.8", default-features = false, features = [
  "stable_graph",
], optional = true }
regex = "1.12.2"
rig-dynclient = { git = "https://github.com/patonw/rig-dynclient.git", tag = "v0.32.0", features = [
  "rmcp",
] }
rpds = { version = "1.2.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_with = "3.15.0"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
] }
typed-builder = "0.23.1"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
colorous = { version = "1.0.16", optional = true }
derive_builder = "0.20.2"
jaq-core = "2.2.1"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
jaq-std = "2.1.2"
jsonschema = "0.44"
rfd = { version = "0.17.2", optional = true, default-features = false, features = [
  "xdg-portal",
] }
chrono = "0.4.42"
futures-util = "0.3.31"
either = { version = "1.15.0", features = ["serde"] }
dotenvy = { version = "0.15.7", features = ["clap"] }
humantime = "2.3.0"
enum-assoc = "1.3.0"
enum-iterator = "2.3.0"
typetag = "0.2.21"
downcast-rs = "2.0.2"
dyn-eq = "0.1.3"
saphyr = { version = "0.0.6", optional = true }
dyn-clone = "1.0.20"
dyn-hash = "1.0.0"
inventory = "0.3.21"
rhai = { version = "1.23.6", optional = true, features = [
  "serde",
  "serde_json",
] }
scopeguard = "1.2.0"
rayon = "1.11.0"
subst = { version = "0.3.8", features = ["preserve-order"] }
serde_yaml_ng = "0.10.0"

[features]
default = ["scripting", "ui"]
migration = ["dep:saphyr"]
scripting = ["dep:rhai"]
ui = [
  "dep:colorous",
  "dep:eframe",
  "dep:egui",
  "dep:egui-phosphor",
  "dep:egui_commonmark",
  "dep:egui_extras",
  "dep:egui_graphs",
  "dep:egui_tiles",
  "dep:petgraph",
  "dep:rfd",
  "egui-snarl/ui",
]
